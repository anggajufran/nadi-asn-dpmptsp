# Managed separately from Nginx Proxy Manager UI. Public readiness gate:
# serve maintenance until SMTP, backup, data reconciliation and UAT are complete.
server {
    listen 80;
    listen [::]:80;
    server_name nadiasndpmptspsulteng.online www.nadiasndpmptspsulteng.online;
    include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;
    location / { return 301 https://nadiasndpmptspsulteng.online$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nadiasndpmptspsulteng.online;
    ssl_certificate /etc/letsencrypt/nadi-asn/live/nadiasndpmptspsulteng.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/nadi-asn/live/nadiasndpmptspsulteng.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://nadiasndpmptspsulteng.online$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nadiasndpmptspsulteng.online;
    ssl_certificate /etc/letsencrypt/nadi-asn/live/nadiasndpmptspsulteng.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/nadi-asn/live/nadiasndpmptspsulteng.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    access_log /data/logs/nadi-domain_access.log standard;
    error_log /data/logs/nadi-domain_error.log warn;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After 3600 always;
    error_page 503 /maintenance.html;
    location = /maintenance.html { internal; root /data/nadi-public; }
    location / { return 503; }
}
