# Production domain. Maintenance rollback: nadi-domain.conf.
server {
    listen 80;
    listen [::]:80;
    server_name nadiasndpmptspsulteng.online www.nadiasndpmptspsulteng.online;
    include /etc/nginx/conf.d/include/letsencrypt-acme-challenge.conf;
    location / { return 301 https://nadiasndpmptspsulteng.online$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.nadiasndpmptspsulteng.online;
    ssl_certificate /etc/letsencrypt/nadi-asn/live/nadiasndpmptspsulteng.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/nadi-asn/live/nadiasndpmptspsulteng.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://nadiasndpmptspsulteng.online$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name nadiasndpmptspsulteng.online;
    ssl_certificate /etc/letsencrypt/nadi-asn/live/nadiasndpmptspsulteng.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/nadi-asn/live/nadiasndpmptspsulteng.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 6m;
    access_log /data/logs/nadi-domain_access.log standard;
    error_log /data/logs/nadi-domain_error.log warn;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location / {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $nadi_upstream nadi-asn-edge;
        proxy_pass https://$nadi_upstream:8443;
        proxy_ssl_server_name on;
        proxy_ssl_name localhost;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /data/nadi-public/upstream-ca.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $realip_remote_addr;
        proxy_set_header X-Real-IP $realip_remote_addr;
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_hide_header Strict-Transport-Security;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Content-Security-Policy;
    }
}
