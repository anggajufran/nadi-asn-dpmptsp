Foreground yes
User clamav
TCPSocket 3310
TCPAddr 0.0.0.0
LocalSocket /tmp/clamd.sock
LogTime yes
LogClean no
DatabaseDirectory /var/lib/clamav
SelfCheck 600
MaxThreads 2
MaxQueue 8
StreamMaxLength 6M
MaxFileSize 30M
MaxScanSize 40M
MaxRecursion 10
MaxFiles 2500
AlertExceedsMax yes
AlertEncrypted yes
ReadTimeout 30
CommandReadTimeout 10
