expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL
upload_max_filesize = 5M
post_max_size = 6M
max_file_uploads = 1
memory_limit = 256M
max_execution_time = 60
session.use_strict_mode = 1
zend.exception_ignore_args = On
opcache.enable = 1
opcache.validate_timestamps = 0
