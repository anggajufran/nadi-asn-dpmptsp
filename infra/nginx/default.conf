server {
    listen 8443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    root /var/www/dist;
    index index.html;
    client_max_body_size 6m;
    include /etc/nginx/security-headers.conf;
    location ~ /\. { return 404; }
    location ~ \.php$ { return 404; }
    location ~* ^/(storage|vendor|app|config|database|infra|tests|bootstrap)(/|$) { return 404; }
    location ~* ^/(composer\.(json|lock)|package(-lock)?\.json|artisan)$ { return 404; }
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "public, immutable";
    }
    location /api/ { try_files $uri @laravel; }
    location = /up { try_files $uri @laravel; }
    location / { try_files $uri $uri/ /index.html; }
    location @laravel {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_hide_header X-Powered-By;
        fastcgi_param SCRIPT_FILENAME /var/www/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/public;
        fastcgi_param HTTPS on;
        # Direct TLS is the default. Forwarding headers are ignored unless
        # an exact edge-proxy IP has been configured in NADI_TRUSTED_PROXIES.
    }
}
